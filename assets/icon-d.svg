    <use href="#pim" transform="translate(135.4,235.9) scale(0.68)"/>
    <use href="#pim" transform="translate(310.4,262) scale(0.68)"/>
    <use href="#fenn" transform="translate(138.1,277.2) scale(0.68)"/>
    <use href="#odet" transform="translate(316.7,303.1) scale(0.68)"/>
    <use href="#odet" transform="translate(136.7,321.3) scale(0.68)"/>
    <use href="#fenn" transform="translate(300,338.8) scale(0.68)"/>
    <use href="#pim" transform="translate(261.9,361.6) scale(0.68)"/>
    <use href="#pim" transform="translate(135.4,364) scale(0.68)"/>
    <use href="#fenn" transform="translate(181.1,362.6) scale(0.68)"/>
    <use href="#odet" transform="translate(221.6,364) scale(0.68)"/>
  </g>
</svg>
