<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">A capital B drawn by the delegates</title>
  <desc id="d">On a cream ground, a bold capital letter B, one stem and two bowls, is traced by 23 small cut-paper delegates standing shoulder to shoulder over a pale violet shape of the same letter. They alternate: Pim, a light violet droplet with a paintbrush; Odet, a violet square with a spool of thread; Fenn, a deep violet box lid with a set square. The team itself makes the mark.</desc>
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feOffset in="SourceAlpha" dx="4" dy="5" result="o"/>
      <feFlood flood-color="#1F2430" flood-opacity="0.16"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Pim, from ../companions/pim.svg, without its round ground -->
    <g id="pim">
      <g transform="translate(40,106) scale(0.52)">
        <g filter="url(#sh)">
          <path d="M-14,-146 L22,-150 L36,-124 L50,-88 L40,-52 L8,-34 L-30,-42 L-50,-78 L-40,-122 Z" fill="#8B5CF6"/>
          <path d="M-14,-146 L22,-150 L20,-188 Z" fill="#B79CFB"/>
          <path d="M-50,-78 L-30,-42 L8,-34 L-16,-66 Z" fill="#7446E0"/>
          <path d="M-40,-122 L-14,-146 L-24,-116 Z" fill="#9D78F9"/>
        </g>
        <circle cx="-12" cy="-110" r="8.500" fill="#F7F5F0"/><circle cx="14" cy="-111" r="8.500" fill="#F7F5F0"/>
        <circle cx="-9.500" cy="-110" r="4" fill="#1F2430"/><circle cx="16.500" cy="-111" r="4" fill="#1F2430"/>
        <path d="M-46,-94 Q2,-64 48,-92" fill="none" stroke="#4A3A7A" stroke-width="2"/>
        <circle cx="-12" cy="-80.500" r="5" fill="#EDE9FE"/><circle cx="3" cy="-78" r="5" fill="#E0A82E"/><circle cx="18" cy="-81" r="5" fill="#EDE9FE"/>
      </g>
      <path d="M78,74 L82,44" fill="none" stroke="#C9A56A" stroke-width="4.500" stroke-linecap="round"/>
      <path d="M82,45 L83,38" fill="none" stroke="#9CA3AF" stroke-width="7"/>
      <path d="M79.300,38 L86.700,39 L87,30 L85,21 L80.500,29 Z" fill="#2E2152"/>
      <path d="M62,62 Q72,70 79,62" fill="none" stroke="#5B33C9" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Odet, from ../companions/odet.svg -->
    <g id="odet">
      <g transform="translate(40,98) scale(0.5)">
        <g filter="url(#sh)">
          <path d="M-60,-156 L22,-160 L58,-126 L60,-44 L-56,-40 Z" fill="#6D28D9"/>
          <path d="M-60,-156 L-56,-40 L-22,-41 Z" fill="#5A1FBF"/>
          <path d="M22,-160 L58,-126 L24,-123 Z" fill="#A98BF5"/>
        </g>
        <path d="M-44,-157 l-13,15 M-44,-157 l5,20" fill="none" stroke="#E4674F" stroke-width="6" stroke-linecap="butt"/>
        <rect x="-50" y="-163" width="12" height="12" fill="#C9523C" transform="rotate(-12 -44 -157)"/>
        <circle cx="-14" cy="-108" r="8.500" fill="#F7F5F0"/><circle cx="14" cy="-109" r="8.500" fill="#F7F5F0"/>
        <circle cx="-11.500" cy="-108" r="4" fill="#1F2430"/><circle cx="16.500" cy="-109" r="4" fill="#1F2430"/>
        <path d="M-5,-86 h12" fill="none" stroke="#F7F5F0" stroke-width="4" stroke-linecap="round"/>
      </g>
      <path d="M80,50 Q94,40 84,30 Q76,24 82,18" fill="none" stroke="#3B2A6B" stroke-width="1.800" stroke-linecap="round"/>
      <rect x="75" y="49" width="10" height="14" fill="#3B2A6B"/>
      <rect x="73" y="46.500" width="14" height="3.500" fill="#C9A56A"/><rect x="73" y="62" width="14" height="3.500" fill="#C9A56A"/>
      <path d="M68,62 Q72,72 80,67" fill="none" stroke="#4A1AA0" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- Fenn, from ../companions/fenn.svg -->
    <g id="fenn">
      <g transform="translate(34,106) scale(0.46)">
        <path d="M-16,-160 V-210" fill="none" stroke="#5B5548" stroke-width="4" stroke-linecap="round"/>
        <path d="M-16,-210 L16,-199 L-16,-188 Z" fill="#E0A82E"/>
        <g filter="url(#sh)">
          <path d="M-34,-145 L34,-148 L36,-58 L-34,-56 Z" fill="#4C1D95"/>
          <path d="M-34,-145 L34,-148 L26,-170 L-26,-168 Z" fill="#6A3BBE"/>
          <path d="M-34,-145 L-34,-56 L-64,-100 Z" fill="#3B1578"/>
          <path d="M34,-148 L36,-58 L66,-104 Z" fill="#5727A6"/>
          <path d="M-34,-56 L36,-58 L26,-40 L-24,-38 Z" fill="#2F1063"/>
        </g>
        <circle cx="-13" cy="-112" r="8.500" fill="#F7F5F0"/><circle cx="13" cy="-113" r="8.500" fill="#F7F5F0"/>
        <circle cx="-10.500" cy="-112" r="4" fill="#1F2430"/><circle cx="15.500" cy="-113" r="4" fill="#1F2430"/>
        <path d="M-5,-90 q6,5 12,0" fill="none" stroke="#F7F5F0" stroke-width="4" stroke-linecap="round"/>
      </g>
      <path fill-rule="evenodd" d="M64,70 L88,70 L64,46 Z M68,66 L78.500,66 L68,55.500 Z" fill="#7C3AED" fill-opacity="0.82"/>
      <path d="M54,66 Q58,76 65,70" fill="none" stroke="#2F1063" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="#F7F5F0"/>

  <!-- the letter, as a pale shape under the delegates, so that it still reads at 16 px -->
  <path d="M168,398 V116 H262 a68,68 0 0 1 0,136 H168 M168,252 H276 a73,73 0 0 1 0,146 H168" fill="none" stroke="#EDE9FE" stroke-width="64" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 23 delegates along the stem and the two bowls: Pim, Odet, Fenn, in turn -->
  <g>
    <use href="#odet" transform="translate(153.7,82) scale(0.68)"/>
    <use href="#fenn" transform="translate(197.7,80.6) scale(0.68)"/>
    <use href="#pim" transform="translate(237.7,82.5) scale(0.68)"/>
