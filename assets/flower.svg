<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">The roles of Bive as one flower around Maren, the owner</title>
  <desc id="d">A cut-paper flower on a cream ground. At its centre, in a gold ring, Maren, the owner: a human with dark hair and a dark coat holding up a capped pen. Around her, five soft petals, each carrying one companion: Odet, a violet square with a spool, at the top; then clockwise Brae, the amber folder of the coordinator; Pim, a light violet droplet with a brush; Fenn, a deep violet box lid with a set square; and Sill, the teal folded letter of the advisor.</desc>
