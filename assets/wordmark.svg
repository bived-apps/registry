<svg xmlns="http://www.w3.org/2000/svg" width="891" height="370" viewBox="132 64 891 370" role="img" aria-labelledby="t d">
  <title id="t">Bive, the word drawn by the team</title>
  <desc id="d">The word Bive, a capital B then a lowercase i, v and e, on a transparent ground. Each letter is traced by small cut-paper companions standing shoulder to shoulder over a pale violet shape of the same letter, 59 in all. The B is the one of Bive's mark: 23 violet delegates, Pim with a paintbrush, Odet with a spool of thread, Fenn with a set square, in turn. The i, the v and the e are each traced by every working role: the delegates again, with Sill, the advisor, a teal folded letter with an answer bubble, and Brae, the coordinator, a wide amber folder, among them. Maren, the owner, a human in a dark coat holding a pen, appears once: she is the dot of the i.</desc>
